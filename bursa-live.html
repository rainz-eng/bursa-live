<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bursa Live – Game Trading Harga Real-Time</title>
<style>
:root{--bg:#f3efe6;--panel:#fffdf8;--ink:#1d2a2a;--mute:#6b7774;--line:#ddd6c6;--up:#0b8a5f;--down:#c8372d;--acc:#1f4e5f}
@media (prefers-color-scheme:dark){:root{--bg:#10191c;--panel:#17242a;--ink:#e8efe9;--mute:#8aa09d;--line:#27383f;--up:#35d39a;--down:#ff6b5e;--acc:#6cc3d9}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font:700 26px Georgia,serif;letter-spacing:-.5px}
.status{font-size:13px;color:var(--mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mute);margin-right:6px}
.dot.live{background:var(--up);animation:p 1.4s infinite}.dot.sim{background:#d9a21b}
@keyframes p{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}
.worth{text-align:right}
.worth b{font:700 30px Georgia,serif;display:block}
.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
.tab[aria-pressed=true]{background:var(--acc);color:var(--panel);border-color:var(--acc)}
.price{font:700 34px Georgia,serif}
.chg{font-weight:700;margin-left:8px}
.up{color:var(--up)}.down{color:var(--down)}
canvas{width:100%;height:260px;display:block;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
button.act{flex:1;min-width:70px;padding:10px;border-radius:8px;border:0;font:700 15px inherit;cursor:pointer;color:#fff}
.buy{background:var(--up)}.sell{background:var(--down)}
button.pct{padding:6px 10px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;cursor:pointer;font:inherit}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=number]{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:600}
.log{max-height:150px;overflow:auto;font-size:13px;color:var(--mute)}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
h2{font:700 16px Georgia,serif;margin:0 0 8px}
.rank{font-size:13px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.reset{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.toast{min-height:20px;font-size:13px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Bursa Live</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="stat">Menghubungkan ke pasar…</span></div>
  </div>
  <div class="worth"><span class="rank" id="rank"></span><b id="worth">$10,000.00</b><span id="pl" class="rank"></span></div>
</header>

<div class="grid">
  <section class="panel">
    <div class="tabs" id="tabs" role="group" aria-label="Pilih aset"></div>
    <div><span class="price" id="price">–</span><span class="chg" id="chg"></span></div>
    <canvas id="chart" aria-label="Grafik harga"></canvas>
    <div style="margin-top:12px">
      <label for="amt" class="rank">Jumlah transaksi (USD)</label>
      <input type="number" id="amt" min="1" step="any" value="1000">
      <div class="row" id="pcts"></div>
      <div class="row">
        <button class="act buy" id="buy">Beli</button>
        <button class="act sell" id="sell">Jual</button>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </section>

  <aside style="display:grid;gap:14px;align-content:start">
    <section class="panel">
      <h2>Portofolio</h2>
      <div class="rank">Kas: <b id="cash">$10,000.00</b></div>
      <div class="bar"><i id="goal"></i></div>
      <div class="rank" id="goalTxt">Target: $15,000</div>
      <table><thead><tr><th>Aset</th><th>Jumlah</th><th>Nilai</th><th>P/L</th></tr></thead><tbody id="hold"></tbody></table>
    </section>
    <section class="panel">
      <h2>Riwayat</h2>
      <div class="log" id="log"><div>Belum ada transaksi.</div></div>
      <p style="margin:10px 0 0"><button class="reset" id="reset">Mulai ulang dengan $10,000</button></p>
    </section>
  </aside>
</div>
<p class="rank">Uang di game ini virtual. Harga mengikuti pasar crypto sungguhan lewat data publik Binance. Bukan saran investasi.</p>
</div>

<script>
const START=10000, GOAL=15000;
const ASSETS={BTC:'btcusdt',ETH:'ethusdt',SOL:'solusdt',BNB:'bnbusdt',DOGE:'dogeusdt'};
const FALLBACK={BTC:90000,ETH:3200,SOL:150,BNB:600,DOGE:0.2};
const SYMS=Object.keys(ASSETS);
let prices={},series={},open24={},cur='BTC',mode='connecting',lastTick=0;
let S=load();

function load(){
  try{const s=JSON.parse(localStorage.getItem('bursalive'));if(s&&s.cash!=null)return s}catch(e){}
  return {cash:START,hold:{},cost:{},log:[]};
}
function save(){try{localStorage.setItem('bursalive',JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const usd=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtP=p=>p==null?'–':(p<1?'$'+p.toFixed(5):usd(p));
SYMS.forEach(s=>{series[s]=[]});

/* ---------- Data pasar ---------- */
async function loadHistory(){
  await Promise.all(SYMS.map(async s=>{
    try{
      const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${s}USDT&interval=1m&limit=120`);
      const k=await r.json();
      series[s]=k.map(x=>+x[4]);
      open24[s]=+k[0][1];
      prices[s]=series[s][series[s].length-1];
    }catch(e){}
  }));
}
function connectWS(){
  const url='wss://stream.binance.com:9443/stream?streams='+SYMS.map(s=>ASSETS[s]+'@miniTicker').join('/');
  let ws;
  try{ws=new WebSocket(url)}catch(e){return startSim()}
  const guard=setTimeout(()=>{if(mode!=='live')startSim()},6000);
  ws.onmessage=ev=>{
    const d=JSON.parse(ev.data).data;if(!d)return;
    const s=d.s.replace('USDT','');if(!ASSETS[s])return;
    mode='live';lastTick=Date.now();
    prices[s]=+d.c;open24[s]=+d.o;
    setStatus();
  };
  ws.onerror=()=>{clearTimeout(guard);if(mode!=='live')startSim()};
  ws.onclose=()=>{if(mode==='live'){mode='connecting';setStatus();setTimeout(connectWS,3000)}};
}
let simOn=false;
function startSim(){
  if(simOn)return;simOn=true;mode='sim';
  SYMS.forEach(s=>{if(!prices[s]){prices[s]=FALLBACK[s];open24[s]=FALLBACK[s];series[s]=Array(60).fill(FALLBACK[s])}});
  setStatus();
}
function setStatus(){
  const d=$('dot'),t=$('stat');
  if(mode==='live'){d.className='dot live';t.textContent='Live: harga pasar sungguhan (Binance)'}
  else if(mode==='sim'){d.className='dot sim';t.textContent='Mode simulasi: tidak bisa terhubung ke pasar, harga bergerak acak'}
  else{d.className='dot';t.textContent='Menghubungkan ke pasar…'}
}
/* tiap detik: catat harga ke grafik (atau gerakkan simulasi) */
setInterval(()=>{
  SYMS.forEach(s=>{
    if(mode==='sim'&&prices[s]){prices[s]*=1+(Math.random()-.5)*0.0016}
    if(prices[s]!=null){series[s].push(prices[s]);if(series[s].length>300)series[s].shift()}
  });
  render();
},1000);

/* ---------- Trading ---------- */
function worth(){let w=S.cash;for(const s in S.hold)w+=S.hold[s]*(prices[s]||0);return w}
function toast(m,c){const t=$('toast');t.textContent=m;t.style.color=c||'var(--mute)'}
function trade(side){
  const p=prices[cur];if(!p)return toast('Harga belum tersedia.','var(--down)');
  let amt=parseFloat($('amt').value);
  if(!(amt>0))return toast('Masukkan jumlah USD yang valid.','var(--down)');
  if(side==='buy'){
    if(amt>S.cash+1e-9)return toast('Kas tidak cukup. Sisa '+usd(S.cash)+'.','var(--down)');
    const q=amt/p,h=S.hold[cur]||0,c=S.cost[cur]||0;
    S.cost[cur]=(h*c+amt)/(h+q);S.hold[cur]=h+q;S.cash-=amt;
    addLog(`Beli ${q.toFixed(6)} ${cur} @ ${fmtP(p)}`);
  }else{
    const h=S.hold[cur]||0,val=h*p;
    if(h<=0)return toast('Kamu belum punya '+cur+'.','var(--down)');
    if(amt>val)amt=val;
    const q=amt/p,pl=q*(p-S.cost[cur]);
    S.hold[cur]=h-q;S.cash+=amt;
    if(S.hold[cur]*p<0.01){delete S.hold[cur];delete S.cost[cur]}
    addLog(`Jual ${q.toFixed(6)} ${cur} @ ${fmtP(p)} (${pl>=0?'+':''}${usd(pl)})`);
  }
  save();render();toast('Transaksi berhasil.','var(--up)');
}
function addLog(t){S.log.unshift(new Date().toLocaleTimeString('id-ID')+' '+t);S.log=S.log.slice(0,40)}
$('buy').onclick=()=>trade('buy');
$('sell').onclick=()=>trade('sell');
$('reset').onclick=()=>{if(confirm('Mulai ulang? Semua posisi dan riwayat akan dihapus.')){S={cash:START,hold:{},cost:{},log:[]};save();render()}};
[25,50,100].forEach(p=>{
  const b=document.createElement('button');b.className='pct';b.textContent=p+'% kas';
  b.onclick=()=>{$('amt').value=(S.cash*p/100).toFixed(2)};$('pcts').appendChild(b);
});
const bs=document.createElement('button');bs.className='pct';bs.textContent='Semua '+'posisi';
bs.onclick=()=>{$('amt').value=(((S.hold[cur]||0)*(prices[cur]||0))).toFixed(2)};$('pcts').appendChild(bs);

/* ---------- Tampilan ---------- */
SYMS.forEach(s=>{
  const b=document.createElement('button');b.className='tab';b.textContent=s;b.setAttribute('aria-pressed',s===cur);
  b.onclick=()=>{cur=s;[...$('tabs').children].forEach(x=>x.setAttribute('aria-pressed',x.textContent===s));render()};
  $('tabs').appendChild(b);
});
function rankOf(w){
  if(w>=GOAL)return 'Paus Bursa';if(w>=12000)return 'Trader Handal';
  if(w>=START)return 'Investor Pemula';if(w>=7000)return 'Trader Waspada';return 'Perlu Belajar Lagi';
}
function render(){
  const p=prices[cur];
  $('price').textContent=fmtP(p);
  if(p!=null&&open24[cur]){const c=(p/open24[cur]-1)*100;const e=$('chg');e.textContent=(c>=0?'+':'')+c.toFixed(2)+'%';e.className='chg '+(c>=0?'up':'down')}
  const w=worth(),pl=w-START;
  $('worth').textContent=usd(w);
  $('pl').innerHTML=`<span class="${pl>=0?'up':'down'}">${pl>=0?'+':''}${usd(pl)}</span>`;
  $('rank').textContent=rankOf(w);
  $('cash').textContent=usd(S.cash);
  const g=Math.max(0,Math.min(100,(w-START)/(GOAL-START)*100));
  $('goal').style.width=g+'%';$('goalTxt').textContent='Target '+usd(GOAL)+' ('+g.toFixed(0)+'%)';
  const rows=Object.keys(S.hold).map(s=>{
    const q=S.hold[s],v=q*(prices[s]||0),pl=q*((prices[s]||0)-S.cost[s]);
    return `<tr><td>${s}</td><td>${q<1?q.toFixed(5):q.toFixed(2)}</td><td>${usd(v)}</td><td class="${pl>=0?'up':'down'}">${pl>=0?'+':''}${usd(pl)}</td></tr>`}).join('');
  $('hold').innerHTML=rows||'<tr><td colspan="4" style="text-align:center;color:var(--mute)">Belum ada aset.</td></tr>';
  $('log').innerHTML=S.log.length?S.log.map(l=>'<div>'+l+'</div>').join(''):'<div>Belum ada transaksi.</div>';
  draw();
}
function draw(){
  const cv=$('chart'),dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=H*dpr}
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const d=series[cur];if(d.length<2)return;
  let mn=Math.min(...d),mx=Math.max(...d);if(mn===mx){mn*=.999;mx*=1.001}
  const pad=(mx-mn)*.1;mn-=pad;mx+=pad;
  const st=getComputedStyle(document.documentElement);
  const up=d[d.length-1]>=d[0],col=st.getPropertyValue(up?'--up':'--down').trim();
  const X=i=>i/(d.length-1)*(W-60),Y=v=>H-(v-mn)/(mx-mn)*H;
  x.strokeStyle=st.getPropertyValue('--line').trim();x.lineWidth=1;x.fillStyle=st.getPropertyValue('--mute').trim();x.font='11px sans-serif';
  for(let i=0;i<4;i++){const v=mn+(mx-mn)*i/3,y=Y(v);x.beginPath();x.moveTo(0,y);x.lineTo(W-58,y);x.stroke();x.fillText(v<1?v.toFixed(4):v.toFixed(2),W-56,y-2)}
  x.beginPath();d.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));
  x.strokeStyle=col;x.lineWidth=2;x.stroke();
  if(S.cost[cur]&&S.cost[cur]>mn&&S.cost[cur]<mx){x.setLineDash([5,4]);x.strokeStyle=st.getPropertyValue('--acc').trim();x.beginPath();x.moveTo(0,Y(S.cost[cur]));x.lineTo(W-58,Y(S.cost[cur]));x.stroke();x.setLineDash([]);x.fillStyle=x.strokeStyle;x.fillText('modal',4,Y(S.cost[cur])-3)}
}
window.addEventListener('resize',draw);

loadHistory().then(()=>{render();connectWS()});
setTimeout(()=>{if(mode==='connecting')startSim()},8000);
render();
</script>
</body>
</html>
